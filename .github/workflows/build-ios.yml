name: Build iOS App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build FocusTube iOS App
    runs-on: macos-13

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -switch /Applications/Xcode_15.2.app || sudo xcode-select -switch /Applications/Xcode_15.0.1.app || sudo xcode-select -switch /Applications/Xcode_14.3.1.app || sudo xcode-select -switch /Applications/Xcode.app

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Build FocusTube for iOS Simulator
        run: |
          cd ios/FocusTube
          xcodebuild -project FocusTube.xcodeproj \
                     -scheme FocusTube \
                     -configuration Release \
                     -destination 'generic/platform=iOS Simulator' \
                     -derivedDataPath build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     clean build

      - name: Package Simulator App Bundle
        run: |
          cd ios/FocusTube/build/Build/Products/Release-iphonesimulator
          zip -r -X FocusTube-iOS-Simulator.zip FocusTube.app

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FocusTube-iOS-Simulator
          path: ios/FocusTube/build/Build/Products/Release-iphonesimulator/FocusTube-iOS-Simulator.zip
          retention-days: 14
